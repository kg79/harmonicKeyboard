<!doctype html>
<html>
  <head>
   <link rel='stylesheet' href='style.css'>
   <script src='script.js' defer></script>
   
  </head>
  <body>
    <section id='top'>
      
      <div class='interfaceRows'></div>
      <div class='interfaceRows'></div>
      <div class='interfaceRows'></div>
      
    </section>
    <section id='bottom'>
      
      <div class='controlColumns'>
	<h2>Basic</h2>

	<div class='basicControls'>
	  <label>initialize</label>
	  <button id='init'>audio</button>
	</div>

	<div class='basicControls'>
	  <label>root frequency:</label>
	  <input type="number" id="rootFrequency" value="528">
	</div>

	<div class='basicControls'>
	  <label>volume:</label>
	  <input type='range' id='volume' value='.1' step='.01' min='0' max='1'>
	</div>
      </div>
      
      <div class='controlColumns' id='generativeControlBox'>
	<h2>Generative</h2>
	
	<div class='generativeControls'>
	  <label>generate</label>
	  <input id='degree' type='number' value='6'>
	  <button id='generateHarmonics'>harmonics</button>
	</div>
	
	<div class='generativeControls'>
	  <section id='generatedHarmonics'></section>
	</div>
	

      </div>
      <div class='controlColumns'>
	<h2>Organizational</h2>
      </div>
      <div class='controlColumns'>
	<h2>Analytical</h2>
      </div>
      
    </section>
    </body>
  </html>
